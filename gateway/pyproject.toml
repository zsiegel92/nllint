[project]
name = "nllint-gateway"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30,<1",
    "blake3>=1,<2",
    "cryptography>=45,<50",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "langfuse>=3,<4",
    "mcp>=1.30,<2",
    "pydantic-ai-slim[openrouter]>=1,<2",
    "pydantic-settings>=2,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "modal>=1.1,<2",
]
