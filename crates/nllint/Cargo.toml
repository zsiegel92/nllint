[package]
name = "nllint"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A cached, concurrent semantic code linter powered by NLLint Gateway"

[dependencies]
async-trait = "0.1"
anyhow = "1.0"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
jsonc-parser = { version = "0.33", features = ["serde"] }
notify = "8.2"
rusqlite = { version = "0.38", features = ["bundled"] }
schemars = "1.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
tokio = { version = "1.47", features = ["fs", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
url = "2.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
